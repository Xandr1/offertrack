name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.34.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web run lint

      - name: Typecheck
        run: pnpm --dir apps/web run typecheck

      - name: Test
        run: pnpm --dir apps/web run test

      - name: Build
        env:
          APP_ENV: test
          NEXT_PUBLIC_API_URL: http://127.0.0.1:18080
        run: pnpm --dir apps/web run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Prepare environment
        run: |
          cp .env.example .env
          chmod +x scripts/backend-codegen.sh apps/core-api/mvnw

      - name: Check Docker
        run: |
          docker version
          docker compose version

      - name: Generate backend sources
        run: ./scripts/backend-codegen.sh

      - name: Spotless check
        working-directory: apps/core-api
        run: ./mvnw spotless:check

      - name: Test
        working-directory: apps/core-api
        run: ./mvnw test

      - name: Upload failed backend test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-reports
          path: apps/core-api/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up Compose services
        if: always()
        run: docker compose down -v

  ai-service:
    name: AI service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/ai-service/pyproject.toml
            apps/ai-service/pylock.toml
            apps/ai-service/pylock.test.toml

      - name: Verify dependency lock freshness
        working-directory: apps/ai-service
        run: |
          bash scripts/lock-dependencies.sh
          git diff --exit-code -- \
            pylock.toml pylock.toml.sha256 \
            pylock.test.toml pylock.test.toml.sha256

      - name: Install locked dependencies
        working-directory: apps/ai-service
        run: |
          sha256sum --check pylock.test.toml.sha256
          python -m pip install --requirement pylock.test.toml

      - name: Ruff
        working-directory: apps/ai-service
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pyright
        working-directory: apps/ai-service
        run: python -m pyright

      - name: Pytest
        working-directory: apps/ai-service
        run: python -m pytest

      - name: Verify production image
        working-directory: apps/ai-service
        run: bash scripts/verify-runtime-image.sh

  e2e:
    name: Playwright E2E
    needs:
      - frontend
      - backend
      - ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.34.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Prepare scripts
        run: chmod +x scripts/backend-codegen.sh scripts/e2e/run-e2e.sh apps/core-api/mvnw

      - name: Verify service-log sanitization
        run: bash scripts/e2e/test-sanitize-service-log.sh

      - name: Run smoke tests twice from clean state
        run: |
          ./scripts/e2e/run-e2e.sh
          ./scripts/e2e/run-e2e.sh

      - name: Upload failed Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 3

      - name: Clean up isolated E2E services
        if: always()
        run: docker compose --project-name offertrack-e2e --file docker-compose.e2e.yml down --volumes --remove-orphans
