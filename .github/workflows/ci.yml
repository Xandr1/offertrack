name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true

    defaults:
      run:
        working-directory: infra/terraform/staging

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialize without backend access
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/web run lint

      - name: Typecheck
        run: pnpm --dir apps/web run typecheck

      - name: Test
        run: pnpm --dir apps/web run test

      - name: Build
        env:
          APP_ENV: test
          NEXT_PUBLIC_API_URL: http://127.0.0.1:18080
        run: pnpm --dir apps/web run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Prepare environment
        run: |
          cp .env.example .env
          chmod +x scripts/backend-codegen.sh apps/core-api/mvnw

      - name: Check Docker
        run: |
          docker version
          docker compose version

      - name: Generate backend sources
        run: ./scripts/backend-codegen.sh

      - name: Spotless check
        working-directory: apps/core-api
        run: ./mvnw spotless:check

      - name: Test
        working-directory: apps/core-api
        run: ./mvnw test

      - name: Upload failed backend test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: apps/core-api/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up Compose services
        if: always()
        run: docker compose down -v

  ai-service:
    name: AI service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/ai-service/pyproject.toml
            apps/ai-service/pylock.toml
            apps/ai-service/pylock.test.toml

      - name: Verify committed dependency locks
        working-directory: apps/ai-service
        run: |
          sha256sum --check pylock.toml.sha256
          sha256sum --check pylock.test.toml.sha256

      - name: Install locked dependencies
        working-directory: apps/ai-service
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install --requirement pylock.test.toml

      - name: Ruff
        working-directory: apps/ai-service
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Pyright
        working-directory: apps/ai-service
        run: python -m pyright

      - name: Pytest
        working-directory: apps/ai-service
        run: python -m pytest

      - name: Verify production image
        working-directory: apps/ai-service
        run: bash scripts/verify-runtime-image.sh

  container-smoke:
    name: Production container smoke
    needs:
      - frontend
      - backend
      - ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OFFERTRACK_IMAGE_TAG: ci-${{ github.sha }}-${{ github.run_attempt }}
      OFFERTRACK_SMOKE_PROJECT_NAME: offertrack-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      OFFERTRACK_CODEGEN_PROJECT_NAME: offertrack-codegen-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3.6.1

      - name: Validate isolated container scope
        run: |
          set -euo pipefail

          expected_smoke="offertrack-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_codegen="offertrack-codegen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_temp="${RUNNER_TEMP%/}/offertrack-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$OFFERTRACK_SMOKE_PROJECT_NAME" == "$expected_smoke" ]]
          [[ "$OFFERTRACK_SMOKE_PROJECT_NAME" =~ ^offertrack-smoke-[0-9]+-[0-9]+$ ]]
          [[ "$OFFERTRACK_CODEGEN_PROJECT_NAME" == "$expected_codegen" ]]
          [[ "$OFFERTRACK_CODEGEN_PROJECT_NAME" =~ ^offertrack-codegen-[0-9]+-[0-9]+$ ]]
          resolved_runner_temp="$(realpath -m -- "$RUNNER_TEMP")"
          resolved_temp="$(realpath -m -- "$expected_temp")"
          [[ "$resolved_runner_temp" != "/" ]]
          [[ "$resolved_temp" == "$resolved_runner_temp/offertrack-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]

          mkdir -p -- "$expected_temp"
          printf '%s\n' "OFFERTRACK_CONTAINER_TEMP_ROOT=$expected_temp" >>"$GITHUB_ENV"

      - name: Prepare container scripts
        run: |
          chmod +x apps/core-api/mvnw
          chmod +x scripts/containers/build-images.sh scripts/containers/run-smoke.sh

      - name: Check Docker
        run: |
          docker version
          docker compose version
          docker buildx version

      - name: Run fast container contract tests
        run: TMPDIR="$OFFERTRACK_CONTAINER_TEMP_ROOT" bash scripts/containers/test.sh

      - name: Build and load production images
        id: build_images
        run: |
          bash scripts/containers/build-images.sh \
            --app-env e2e \
            --next-public-api-url http://127.0.0.1:18081 \
            --tag "$OFFERTRACK_IMAGE_TAG"

      - name: Scan Web image
        id: trivy_web
        if: always() && steps.build_images.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: offertrack/web:${{ env.OFFERTRACK_IMAGE_TAG }}
          format: json
          output: ${{ runner.temp }}/offertrack-container-${{ github.run_id }}-${{ github.run_attempt }}/trivy-web.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          hide-progress: "true"
          list-all-pkgs: "false"
          timeout: 5m0s

      - name: Scan Core API image
        id: trivy_core
        if: always() && steps.build_images.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: offertrack/core-api:${{ env.OFFERTRACK_IMAGE_TAG }}
          format: json
          output: ${{ runner.temp }}/offertrack-container-${{ github.run_id }}-${{ github.run_attempt }}/trivy-core.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          hide-progress: "true"
          list-all-pkgs: "false"
          timeout: 5m0s

      - name: Scan AI service image
        id: trivy_ai
        if: always() && steps.build_images.outcome == 'success'
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.70.0
          scan-type: image
          image-ref: offertrack/ai-service:${{ env.OFFERTRACK_IMAGE_TAG }}
          format: json
          output: ${{ runner.temp }}/offertrack-container-${{ github.run_id }}-${{ github.run_attempt }}/trivy-ai.json
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "0"
          hide-progress: "true"
          list-all-pkgs: "false"
          timeout: 5m0s

      - name: Run bounded production smoke suite
        id: container_smoke
        if: always() && steps.build_images.outcome == 'success'
        run: bash scripts/containers/run-smoke.sh --no-build --tag "$OFFERTRACK_IMAGE_TAG"

      - name: Apply aggregate Trivy policy
        id: trivy_gate
        if: always() && steps.build_images.outcome == 'success'
        run: |
          python scripts/containers/evaluate-trivy-results.py \
            --image-tag "$OFFERTRACK_IMAGE_TAG" \
            --scan web "$OFFERTRACK_CONTAINER_TEMP_ROOT/trivy-web.json" "${{ steps.trivy_web.outcome }}" \
            --scan core-api "$OFFERTRACK_CONTAINER_TEMP_ROOT/trivy-core.json" "${{ steps.trivy_core.outcome }}" \
            --scan ai-service "$OFFERTRACK_CONTAINER_TEMP_ROOT/trivy-ai.json" "${{ steps.trivy_ai.outcome }}"

      - name: Upload sanitized container failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/container-smoke
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up exact container projects and temporary files
        if: always()
        run: |
          set +e
          cleanup_status=0
          scope_valid=true

          expected_smoke="offertrack-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_codegen="offertrack-codegen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_temp="${RUNNER_TEMP%/}/offertrack-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          resolved_runner_temp="$(realpath -m -- "$RUNNER_TEMP" 2>/dev/null)"
          resolved_temp="$(realpath -m -- "$OFFERTRACK_CONTAINER_TEMP_ROOT" 2>/dev/null)"

          if [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ || ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Refusing cleanup: run identifiers are not numeric." >&2
            scope_valid=false
          fi
          if [[ "$OFFERTRACK_SMOKE_PROJECT_NAME" != "$expected_smoke" || ! "$OFFERTRACK_SMOKE_PROJECT_NAME" =~ ^offertrack-smoke-[0-9]+-[0-9]+$ ]]; then
            echo "Refusing cleanup: smoke project name failed exact validation." >&2
            scope_valid=false
          fi
          if [[ "$OFFERTRACK_CODEGEN_PROJECT_NAME" != "$expected_codegen" || ! "$OFFERTRACK_CODEGEN_PROJECT_NAME" =~ ^offertrack-codegen-[0-9]+-[0-9]+$ ]]; then
            echo "Refusing cleanup: codegen project name failed exact validation." >&2
            scope_valid=false
          fi
          if [[ "$OFFERTRACK_CONTAINER_TEMP_ROOT" != "$expected_temp" || "$resolved_runner_temp" == "/" || "$resolved_temp" != "$resolved_runner_temp/offertrack-container-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            echo "Refusing cleanup: temporary root failed exact resolved-path validation." >&2
            scope_valid=false
          fi

          if [[ "$scope_valid" != true ]]; then
            exit 1
          fi

          cleanup_env="$OFFERTRACK_CONTAINER_TEMP_ROOT/codegen-cleanup.env"
          if ! mkdir -p -- "$OFFERTRACK_CONTAINER_TEMP_ROOT"; then
            echo "Unable to recreate the exact temporary root for cleanup." >&2
            cleanup_status=1
          fi
          if ! printf '%s\n' \
            'POSTGRES_DB=offertrack_codegen' \
            'POSTGRES_USER=offertrack_codegen' \
            'POSTGRES_PASSWORD=container-codegen-postgres-password-not-for-production' \
            >"$cleanup_env"; then
            echo "Unable to recreate the deterministic codegen cleanup environment." >&2
            cleanup_status=1
          else
            chmod 600 "$cleanup_env" 2>/dev/null || true
          fi

          if ! OFFERTRACK_IMAGE_TAG="$OFFERTRACK_IMAGE_TAG" docker compose \
            --project-name "$OFFERTRACK_SMOKE_PROJECT_NAME" \
            --file compose.container-smoke.yml \
            down --volumes --remove-orphans; then
            cleanup_status=1
          fi

          if ! env -u POSTGRES_DB -u POSTGRES_USER -u POSTGRES_PASSWORD docker compose \
            --project-name "$OFFERTRACK_CODEGEN_PROJECT_NAME" \
            --project-directory "$OFFERTRACK_CONTAINER_TEMP_ROOT" \
            --env-file "$cleanup_env" \
            --file compose.container-codegen.yml \
            down --volumes --remove-orphans; then
            cleanup_status=1
          fi

          if ! rm -rf -- "$OFFERTRACK_CONTAINER_TEMP_ROOT"; then
            cleanup_status=1
          fi

          exit "$cleanup_status"

  e2e:
    name: Playwright E2E
    needs:
      - frontend
      - backend
      - ai-service
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Prepare scripts
        run: chmod +x scripts/backend-codegen.sh scripts/e2e/run-e2e.sh apps/core-api/mvnw

      - name: Verify service-log sanitization
        run: bash scripts/e2e/test-sanitize-service-log.sh

      - name: Run smoke tests twice from clean state
        run: |
          ./scripts/e2e/run-e2e.sh
          ./scripts/e2e/run-e2e.sh

      - name: Upload failed Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 3

      - name: Clean up isolated E2E services
        if: always()
        run: docker compose --project-name offertrack-e2e --file docker-compose.e2e.yml down --volumes --remove-orphans
