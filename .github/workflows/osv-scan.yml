name: OSV dependency scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - package.json
      - apps/web/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - osv-scanner.toml
      - apps/core-api/pom.xml
      - apps/ai-service/pyproject.toml
      - apps/ai-service/pylock.toml
      - apps/ai-service/pylock.toml.sha256
      - apps/ai-service/pylock.test.toml
      - apps/ai-service/pylock.test.toml.sha256
      - scripts/osv/**
      - .github/dependabot.yml
      - .github/workflows/**

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    name: Blocking dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify pnpm lockfile splitter
        shell: bash
        run: bash scripts/osv/tests/test-split-pnpm-lockfile.sh

      - name: Verify OSV severity policy
        run: python scripts/osv/tests/test-evaluate-results.py

      - name: Split pnpm lockfile for OSV
        shell: bash
        run: |
          set -euo pipefail
          # The scanner is a Docker action, so its lockfiles must be visible from
          # the workspace mounted into that action rather than only RUNNER_TEMP.
          output_dir="${GITHUB_WORKSPACE%/}/.osv-pnpm-lockfiles"
          [[ -d "$GITHUB_WORKSPACE" ]]
          [[ ! -e "$output_dir" ]]
          bash scripts/osv/split-pnpm-lockfile.sh pnpm-lock.yaml "$output_dir"

      - name: Resolve Maven dependency inventory
        working-directory: apps/core-api
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp dependency:tree \
            -DoutputType=json \
            -DoutputFile=target/osv-dependency-tree.json

      - name: Create Maven OSV custom lock
        shell: bash
        run: |
          jq '
            def dependencies:
              ., (.children[]? | dependencies);

            [
              .
              | dependencies
              | select(.groupId != null and .artifactId != null and .version != null)
              | select((.groupId + ":" + .artifactId) != "com.offertrack:core-api")
              | {
                  package: {
                    name: (.groupId + ":" + .artifactId),
                    version: .version,
                    ecosystem: "Maven"
                  }
                }
            ]
            | unique_by([.package.name, .package.version])
            | {results: [{packages: .}]}
          ' apps/core-api/target/osv-dependency-tree.json > osv-maven-dependencies.json

          jq -e '.results[0].packages | length > 0' osv-maven-dependencies.json >/dev/null

      - name: Scan committed dependency sources
        id: osv
        shell: bash
        run: |
          # OSV-Scanner uses exit 0 for a clean scan and 1 when it finds an
          # unignored vulnerability. Preserve the exact status for the policy
          # evaluator; all other statuses fail closed there.
          set -u -o pipefail
          if [[ -e osv-results.json ]]; then
            echo "Refusing to evaluate a pre-existing OSV result file." >&2
            exit 1
          fi
          set +e
          docker run --rm \
            --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            ghcr.io/google/osv-scanner-action:v2.3.8 \
            --format=json \
            --output-file=osv-results.json \
            --config=osv-scanner.toml \
            --lockfile=pnpm-lock.yaml:.osv-pnpm-lockfiles/environment/pnpm-lock.yaml \
            --lockfile=pnpm-lock.yaml:.osv-pnpm-lockfiles/project/pnpm-lock.yaml \
            --lockfile=osv-scanner:osv-maven-dependencies.json \
            --lockfile=apps/ai-service/pylock.toml \
            --lockfile=pylock.toml:apps/ai-service/pylock.test.toml
          scanner_exit_code=$?
          set -e

          echo "exit_code=$scanner_exit_code" >> "$GITHUB_OUTPUT"
          echo "OSV-Scanner exited with code $scanner_exit_code."

      - name: Validate and summarize dependency results
        if: always()
        shell: bash
        run: |
          python scripts/osv/evaluate-results.py \
            --results osv-results.json \
            --config osv-scanner.toml \
            --scanner-exit-code "${{ steps.osv.outputs.exit_code }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload OSV results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-results
          path: osv-results.json
          if-no-files-found: warn
          retention-days: 3
