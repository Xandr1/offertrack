name: OSV dependency scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - package.json
      - apps/web/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - apps/core-api/pom.xml
      - apps/ai-service/pyproject.toml
      - apps/ai-service/pylock.toml
      - apps/ai-service/pylock.toml.sha256
      - .github/dependabot.yml
      - .github/workflows/**

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    name: Advisory dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan committed dependency sources
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=pnpm-lock.yaml
            --lockfile=apps/core-api/pom.xml
            --lockfile=apps/ai-service/pylock.toml

      - name: Validate and summarize advisory results
        shell: bash
        run: |
          if [[ ! -s osv-results.json ]]; then
            echo "OSV-Scanner did not produce a result file." >&2
            exit 1
          fi

          jq -e '(.results | type) == "array"' osv-results.json >/dev/null
          vulnerability_count="$(jq '[.results[]?.packages[]?.vulnerabilities[]?] | length' osv-results.json)"
          echo "OSV-Scanner reported ${vulnerability_count} vulnerability entries."
          jq -r '.results[]?.packages[]?.vulnerabilities[]?.id' osv-results.json | sort -u

          # The baseline remains advisory until a verified clean run. A missing
          # or invalid result fails above; vulnerability findings are reported
          # without failing this workflow.
