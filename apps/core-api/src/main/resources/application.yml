spring:
  application:
    name: core-api

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:10s}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/offertrack}
    username: ${DB_USER:offertrack}
    password: ${DB_PASSWORD:offertrack}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

  jooq:
    sql-dialect: POSTGRES

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

management:
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:48h}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:access_token}
      path: ${AUTH_COOKIE_PATH:/}
      domain: ${AUTH_COOKIE_DOMAIN:}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:no-reply@offertrack.local}
  oauth:
    authorization-request-cookie-signing-secret: ${OAUTH_COOKIE_SECRET:${app.jwt.secret}}
  web:
    url: ${APP_WEB_URL:http://localhost:3000}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-api-key: ${AI_SERVICE_INTERNAL_API_KEY:local-dev-ai-service-key}
    auth-mode: ${AI_SERVICE_AUTH_MODE:internal-key}
    audience: ${AI_SERVICE_AUDIENCE:}
  ai-draft-cache:
    enabled: ${AI_DRAFT_CACHE_ENABLED:true}
    ttl: ${AI_DRAFT_CACHE_TTL:24h}
  rate-limit:
    key-secret: ${RATE_LIMIT_KEY_SECRET:local-dev-rate-limit-key-secret-change-me}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
    login-email:
      max-attempts: ${RATE_LIMIT_LOGIN_EMAIL_MAX_ATTEMPTS:5}
      window: ${RATE_LIMIT_LOGIN_EMAIL_WINDOW:15m}
    login-ip:
      max-attempts: ${RATE_LIMIT_LOGIN_IP_MAX_ATTEMPTS:20}
      window: ${RATE_LIMIT_LOGIN_IP_WINDOW:15m}
    registration-email:
      max-attempts: ${RATE_LIMIT_REGISTRATION_EMAIL_MAX_ATTEMPTS:3}
      window: ${RATE_LIMIT_REGISTRATION_EMAIL_WINDOW:1h}
    registration-ip:
      max-attempts: ${RATE_LIMIT_REGISTRATION_IP_MAX_ATTEMPTS:5}
      window: ${RATE_LIMIT_REGISTRATION_IP_WINDOW:1h}
    verification-resend-email:
      max-attempts: ${RATE_LIMIT_VERIFICATION_RESEND_EMAIL_MAX_ATTEMPTS:3}
      window: ${RATE_LIMIT_VERIFICATION_RESEND_EMAIL_WINDOW:1h}
    verification-resend-ip:
      max-attempts: ${RATE_LIMIT_VERIFICATION_RESEND_IP_MAX_ATTEMPTS:10}
      window: ${RATE_LIMIT_VERIFICATION_RESEND_IP_WINDOW:1h}
    forgot-password-email:
      max-attempts: ${RATE_LIMIT_FORGOT_PASSWORD_EMAIL_MAX_ATTEMPTS:5}
      window: ${RATE_LIMIT_FORGOT_PASSWORD_EMAIL_WINDOW:1h}
    forgot-password-ip:
      max-attempts: ${RATE_LIMIT_FORGOT_PASSWORD_IP_MAX_ATTEMPTS:20}
      window: ${RATE_LIMIT_FORGOT_PASSWORD_IP_WINDOW:1h}
    reset-password-token:
      max-attempts: ${RATE_LIMIT_RESET_PASSWORD_TOKEN_MAX_ATTEMPTS:10}
      window: ${RATE_LIMIT_RESET_PASSWORD_TOKEN_WINDOW:1h}
    reset-password-ip:
      max-attempts: ${RATE_LIMIT_RESET_PASSWORD_IP_MAX_ATTEMPTS:20}
      window: ${RATE_LIMIT_RESET_PASSWORD_IP_WINDOW:1h}
    ai-user-minute:
      max-attempts: ${RATE_LIMIT_AI_USER_MINUTE_MAX_ATTEMPTS:10}
      window: ${RATE_LIMIT_AI_USER_MINUTE_WINDOW:1m}
    ai-user-day:
      max-attempts: ${RATE_LIMIT_AI_USER_DAY_MAX_ATTEMPTS:100}
      window: ${RATE_LIMIT_AI_USER_DAY_WINDOW:1d}

---
spring:
  config:
    activate:
      on-profile: "prod | production | stage | staging"
  datasource:
    url: ${DATABASE_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:}
      timeout: ${REDIS_TIMEOUT:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:}

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:}
      path: ${AUTH_COOKIE_PATH:}
      domain: ${AUTH_COOKIE_DOMAIN:}
      secure: ${AUTH_COOKIE_SECURE:}
      same-site: ${AUTH_COOKIE_SAME_SITE:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    from: ${MAIL_FROM:}
  oauth:
    authorization-request-cookie-signing-secret: ${OAUTH_COOKIE_SECRET:}
  web:
    url: ${APP_WEB_URL:}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:}
    internal-api-key: ${AI_SERVICE_INTERNAL_API_KEY:}
    auth-mode: ${AI_SERVICE_AUTH_MODE:}
    audience: ${AI_SERVICE_AUDIENCE:}
  rate-limit:
    key-secret: ${RATE_LIMIT_KEY_SECRET:}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:false}
