spring:
  application:
    name: core-api

  datasource:
    url: jdbc:postgresql://localhost:5432/offertrack
    username: offertrack
    password: offertrack

  flyway:
    enabled: true

  jooq:
    sql-dialect: POSTGRES

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: 8080

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: "change-me-change-me-change-me-change-me-change-me"
    expiration-minutes: 60
  mail:
    from: ${MAIL_FROM:no-reply@offertrack.local}
  oauth:
    authorization-request-cookie-signing-secret: ${OAUTH_COOKIE_SECRET:${app.jwt.secret}}
  web-url: ${APP_WEB_URL:http://localhost:3000}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-api-key: ${AI_SERVICE_INTERNAL_API_KEY:local-dev-ai-service-key}
  ai-draft-cache:
    enabled: ${AI_DRAFT_CACHE_ENABLED:true}
    ttl: ${AI_DRAFT_CACHE_TTL:24h}
