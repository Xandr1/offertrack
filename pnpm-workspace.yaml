packages:
  - "apps/web"

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

overrides:
  # Converge compatible declared ranges on the reviewed fixed versions.
  "@babel/core@": "7.29.6"
  "form-data@": "4.0.6"
  "nanoid@": "3.3.18"
  "postcss@": "8.5.23"
  # Keep separate security targets for consumers on different major versions.
  "brace-expansion@1.1.14": "1.1.18"
  "brace-expansion@5.0.6": "5.0.9"
  "browserslist@<=4.28.6": "4.28.7"
  "js-yaml@3.14.2": "3.15.1"
  "js-yaml@4.1.1": "4.3.1"
  # Preserve the security pin; 0.35.0 is outside Next 16.3.3's ^0.35.3 range.
  "sharp": "0.35.0"

allowBuilds:
  sharp: false
  unrs-resolver: false
