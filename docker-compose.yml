services:
  postgres:
    image: postgres:16
    container_name: offertrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: offertrack
      POSTGRES_USER: offertrack
      POSTGRES_PASSWORD: offertrack
    ports:
      - "5432:5432"
    volumes:
      - offertrack_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: offertrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - offertrack_redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: offertrack-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:latest
    container_name: offertrack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: offertrack
      MINIO_ROOT_PASSWORD: offertrack123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - offertrack_minio_data:/data

volumes:
  offertrack_postgres_data:
  offertrack_redis_data:
  offertrack_minio_data:
