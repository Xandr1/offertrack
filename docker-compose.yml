services:
  postgres:
    image: postgres:16.14-bookworm@sha256:c95fd5346040eba2de3c435e14874af18f5d681fb5848d4f081dbead0878af28
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - offertrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - offertrack_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  ai-service:
    platform: linux/amd64
    build:
      context: ./apps/ai-service
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      AI_SERVICE_INTERNAL_API_KEY: ${AI_SERVICE_INTERNAL_API_KEY:-local-dev-ai-service-key}
      AI_SERVICE_FETCH_TIMEOUT_SECONDS: ${AI_SERVICE_FETCH_TIMEOUT_SECONDS:-10}
      AI_SERVICE_MAX_RESPONSE_BYTES: ${AI_SERVICE_MAX_RESPONSE_BYTES:-10000000}
      AI_SERVICE_MAX_JOB_TEXT_CHARS: ${AI_SERVICE_MAX_JOB_TEXT_CHARS:-18000}
      AI_SERVICE_MAX_REDIRECTS: ${AI_SERVICE_MAX_REDIRECTS:-5}
      AI_SERVICE_ALLOWED_HOSTS: ${AI_SERVICE_ALLOWED_HOSTS-}
      AI_SERVICE_DOCS_ENABLED: ${AI_SERVICE_DOCS_ENABLED-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - offertrack_minio_data:/data

volumes:
  offertrack_postgres_data:
  offertrack_redis_data:
  offertrack_minio_data:
