name: offertrack-e2e

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:c95fd5346040eba2de3c435e14874af18f5d681fb5848d4f081dbead0878af28
    platform: linux/amd64
    environment:
      POSTGRES_DB: offertrack_e2e
      POSTGRES_USER: offertrack_e2e
      POSTGRES_PASSWORD: offertrack_e2e_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.9-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    platform: linux/amd64
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.30.1
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"

volumes:
  postgres_data:
  redis_data:
